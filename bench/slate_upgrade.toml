# Blitz-Swarm Bench Slate — Upgrade
#
# 10 research-synthesis prompts targeting 2025-2026 multi-agent LLM
# orchestration, verification/self-correction, model routing, agent memory,
# and evaluation methodology — the topic space blitz-swarm researches.
#
# Schema mirrors slate_v1.toml exactly, with two added per-prompt fields:
#   expected_subtopics  list of 5-8 key subtopics for programmatic coverage scoring
#   seed                pinned integer for deterministic runs
#
# Per-prompt metadata fields (same keys/order as v1):
#   tier            easy / medium / hard
#   domain          technical / open / adversarial / multi / compositional
#   parallelizable  whether parallel agents should outperform sequential
#                   (per Shen 2603.29632 + Google scaling 2512.08296)
#   tool_heavy      whether topic requires external tool use (web, code exec)
#   budget_usd      per-prompt cost cap
#   expected_coverage  list of keyword strings the judge checks for
#   expected_subtopics list of subtopics for coverage scoring (NEW)
#   seed            pinned integer for reproducibility (NEW)
#
# Tier counts: 2 easy, 5 medium, 3 hard.
# Themes: orchestration, verification/self-correction, routing, memory, evaluation.

schema_version = 1
slate_id = "upgrade"
created_utc = "2026-06-09"
prompt_count = 10

# ---------- EASY (2) ----------

[[prompt]]
id = "u001"
tier = "easy"
domain = "open"
parallelizable = true
tool_heavy = false
budget_usd = 0.05
expected_coverage = ["orchestrator-worker pattern", "blackboard memory", "handoff protocol", "fan-out fan-in", "AutoGen vs LangGraph"]
expected_subtopics = ["orchestrator-worker topology", "blackboard / shared scratchpad", "agent-to-agent handoff protocols", "fan-out / fan-in parallelism", "supervisor vs swarm control flow", "AutoGen vs LangGraph vs CrewAI tradeoffs", "context isolation per sub-agent", "result aggregation strategies"]
seed = 101101
text = "Survey the dominant multi-agent LLM orchestration patterns as of 2025-2026: orchestrator-worker, blackboard, and peer handoff. Contrast the control-flow models of AutoGen, LangGraph, and CrewAI."

[[prompt]]
