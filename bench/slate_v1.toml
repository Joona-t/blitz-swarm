# Blitz-Swarm Bench Slate v1
#
# 30 research-synthesis prompts across easy/medium/hard tiers,
# spanning technical / open-ended / adversarial / multi-domain / compositional.
#
# Each prompt has six metadata fields:
#   tier            easy / medium / hard
#   domain          technical / open / adversarial / multi / compositional
#   parallelizable  whether parallel agents should outperform sequential
#                   (per Shen 2603.29632 + Google scaling 2512.08296)
#   tool_heavy      whether topic requires external tool use (web, code exec)
#   budget_usd      per-prompt cost cap
#   expected_coverage  list of keyword strings the judge checks for
#
# Tier counts: 15 easy, 10 medium, 5 hard.
# Adversarial: 5. Multi-domain: 6. Compositional: 5.

schema_version = 1
slate_id = "v1"
created_utc = "2026-05-09"
prompt_count = 30

