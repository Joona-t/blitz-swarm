# Mythos Swarm — config overlay
# Loaded by mythos.policies.load_mythos_config().
# Keep blitz.toml separate; this overlays only when --mode mythos is active.

[models]
# Provider used by --mode mythos unless --backend / BLITZ_BACKEND is given.
# "claude" puts the planner + verifier on Fable 5.1 (deep tier below);
# set to "" to follow blitz.toml [backend] default (codex).
backend = "claude"
# Role -> TIER (not model names). Tiers resolve through the active backend's
# [backend.providers.<id>.tiers] table in blitz.toml via
# backends.models.resolve_model(role, backend_id, cfg).
#
# On the claude backend: deep = "fable" (Fable 5.1, effort "max") — this is
# the Mythos planner + verifier. fast = "haiku" for cheap parallel executors.
# Switch backends with --backend / BLITZ_BACKEND; the tiers follow.
# Override per role with BLITZ_MODEL_PLANNER / _EXECUTOR / _VERIFIER.
planner_model = "deep"
executor_model = "fast"
verifier_model = "deep"

[policies]
# Loop budget
max_replans = 3
max_executors = 8

# Cost ceiling per task (USD). Applies ONLY when the provider reports cost or
# [backend.providers.<id>.pricing] is configured; unknown cost never trips it.
cost_ceiling_usd = 5.0
# Token ceiling per task (input + output). Applies always.
token_ceiling = 2_000_000

# Timeouts (seconds)
planner_timeout_s = 600
executor_timeout_s = 300
verifier_timeout_s = 600

# Verifier gates. The LLM verdict never passes a round on its own:
# when a deliverable ships a test file, those tests run in a subprocess and
# must pass; a "pass" with confidence below the floor becomes needs_work.
verifier_run_tests = true
verifier_test_timeout_s = 120
verifier_min_confidence = 0.6

# Where to write artifacts
output_dir = "./output/mythos"

# Infrastructure
use_redis = false
use_memory = true
