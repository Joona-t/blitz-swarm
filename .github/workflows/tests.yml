name: tests

on:
  push:
    branches: [main, "next/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extra only — stdlib core, no LLM backend, no paid API)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -q -p no:cacheprovider

  wheel:
    # WP8: the package must work as a real install, not only `pip install -e`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install wheel into a clean venv and run model-free entry points
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/clean/bin/blitz --list-models
          /tmp/clean/bin/blitz --dry-run --no-llm-plan "wheel smoke topic"
          /tmp/clean/bin/python -c "import orchestrator, prompts.loader, backends.adapters.acp; print('imports ok')"

  leak-gate:
    # No home folders or local paths in anything public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Grep tracked files for home paths
        run: |
          if git grep -nE '/Users/[^/ ]+/|/home/[^/ ]+/|scratch-workspaces' -- ':!tests/test_packaging.py' ':!.github/workflows/tests.yml'; then
            echo "home paths found"; exit 1; fi
          echo "clean"
