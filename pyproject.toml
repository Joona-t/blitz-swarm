[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blitz-swarm"
version = "0.1.0"
description = "Parallel multi-agent swarm architecture for collective AI intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Joona", email = "joona@darkfire.dev" }]
dependencies = [
    "redis>=5.0",
    "aiosqlite>=0.20",
    "lancedb>=0.6",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
lab = ["streamlit>=1.42", "plotly>=5.24"]

[tool.setuptools]
py-modules = [
    "agents",
    "blackboard",
    "config",
    "consensus",
    "embedder",
    "orchestrator",
]

[tool.setuptools.packages.find]
include = ["memory", "memory.*", "neural_quest_lab", "neural_quest_lab.*"]
