# Blitz-Swarm Configuration

[swarm]
max_rounds = 4
default_model = "sonnet"
timeout_seconds = 300
max_agents = 10
quality_profile = "max"
# Domain preset for role prompts. Loads from prompts/<domain>/.
# Built-in: "general" (default), "crypto" (v0.1.x trading-research preset).
# Custom domains: drop a folder in prompts/ with the same role files.
domain = "general"
# MAR-style persona-typed critics (factual / logical / counterfactual).
# Off by default — flip to true to use the persona registry from
# prompts/loader.py::assign_personas. Phase 1 mechanism (arXiv 2512.20845).
persona_critics = false

[backend]
default = "codex"
# Leave empty to fail clearly when Codex is unavailable. Add provider ids like
# ["claude", "gemini", "ollama"] only when you explicitly want fallback.
fallback = []

[backend.providers.codex]
adapter = "codex_cli"
model = "gpt-5.5"
reasoning_effort = "high"
sandbox = "read-only"
approval_policy = "never"
ephemeral = true

[backend.providers.claude]
adapter = "claude_cli"
model = "sonnet"
reasoning_effort = "high"
sandbox = "read-only"
approval_policy = "never"
ephemeral = true

[backend.providers.gemini]
adapter = "gemini_cli"
model = ""

[backend.providers.ollama]
adapter = "ollama_http"
model = "qwen2.5:7b"
base_url = "http://localhost:11434"
sandbox = "read-only"
approval_policy = "never"
ephemeral = true

[guard]
enabled = true
mode = "balanced"

[judge_ensemble]
enabled = true
n_judges = 3
ks_threshold = 0.05
ks_consecutive = 2
min_rounds = 2

[selector]
enabled = true
granularity = "section"
n_judges = 3

[memory]
max_context_tokens = 2000
top_k_retrieval = 2
hop_expansion = 1
insight_dedup_threshold = 0.85
query_link_threshold = 0.7
llm_ops_threshold = 10  # activate LLM memory ops after this many queries
gmemory_tier = 3

[redis]
host = "localhost"
port = 6379
db = 0

[storage]
sqlite_path = "memory.db"
lancedb_path = "./memory_vectors"
output_dir = "./output"

[eviction]
query_archive_days = 90
interaction_purge_days = 30
max_archive_per_cycle = 50
cycle_frequency = 10  # run eviction every N tasks
